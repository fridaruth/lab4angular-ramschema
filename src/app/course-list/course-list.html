<div class="course-container">
<h1>Ramschema för Webbutveckling</h1> 

<div class="search-box">
    <label for="search">Sök på kurskod eller kursnamn:</label>
    <input type="text" id="search" placeholder="Sök...(T.ex. Webbutveckling)">
</div>

<table>
    <thead>
        <tr>
            <th>Kurskod</th>
            <th>Kursnamn</th>
            <th>Progression</th>
        </tr>
    </thead>
    <tbody>
        @for (course of courses; track course.code) {
            <tr>
                <td>{{ course.code.toUpperCase() }}</td>
                <td>{{ course.coursename }}</td>
                <td>{{ course.progression }}</td>
            </tr>
        } @empty {
            <tr>
                <td colspan="3">Inga kurser hittades.</td>
            </tr>
        }
    </tbody>
</table>
</div>
